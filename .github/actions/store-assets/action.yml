name: Draw store assets
description: >-
  Installs Cairo and the font the generator requires, draws the Chrome Web Store
  artwork, and verifies the result. Shared so the toolchain — and the font trap
  below — is described in exactly one place.

runs:
  using: composite
  steps:
    - name: Install Cairo and the font the generator asks for
      shell: bash
      run: |
        sudo apt-get update
        # fonts-dejavu-core is not optional: the generator selects "DejaVu Sans"
        # through Cairo's toy font API, which silently substitutes another face
        # when the requested one is absent. Missing it yields artwork in the
        # wrong typeface and a green build.
        sudo apt-get install --no-install-recommends -y libcairo2 fonts-dejavu-core fontconfig
        fc-list | grep -qi 'DejaVuSans' || { echo 'DejaVu Sans is missing' >&2; exit 1; }

    - name: Draw the artwork
      shell: bash
      run: npm run store-assets

    - name: Verify the artwork
      shell: bash
      run: |
        expected="icon-128.png screenshot-panel.png screenshot-export-progress.png small-promo-tile.png"
        for name in $expected; do
          file="store-assets/$name"
          test -f "$file" || { echo "missing $file" >&2; exit 1; }
          # A truncated or non-PNG file would still satisfy test -f.
          file --brief --mime-type "$file" | grep -Fxq image/png \
            || { echo "$file is not a PNG" >&2; exit 1; }
          echo "$(file --brief "$file")  <-  $name"
        done
